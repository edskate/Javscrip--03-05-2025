<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relógio Digital</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background-color: #263238;
      color: #fff;
      text-align: center;
      padding-top: 100px;
    }

    .relogio {
      background-color: #37474f;
      padding: 40px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    #horario {
      font-size: 60px;
      letter-spacing: 4px;
    }

    h1 {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="relogio">
    <h1>Relógio Digital</h1>
    <div id="horario">00:00:00</div>
  </div>

  <script>
    function atualizarRelogio() {
      const agora = new Date();
      let horas = agora.getHours();
      let minutos = agora.getMinutes();
      let segundos = agora.getSeconds();

      // Adiciona zero à esquerda se for menor que 10
      horas = horas < 10 ? "0" + horas : horas;
      minutos = minutos < 10 ? "0" + minutos : minutos;
      segundos = segundos < 10 ? "0" + segundos : segundos;

      const horarioAtual = `${horas}:${minutos}:${segundos}`;
      document.getElementById("horario").textContent = horarioAtual;
    }

    // Atualiza o relógio a cada segundo
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio(); // atualiza imediatamente ao carregar
  </script>
</body>
</html>

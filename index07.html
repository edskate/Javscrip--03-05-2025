<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playlist com LED</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1db954;
      color: #000;
      padding: 1rem;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .player {
      padding: 2rem;
    }

    audio {
      display: none;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }

    li {
      background: #111;
      margin: 1rem auto;
      padding: 1rem;
      max-width: 500px;
      border-radius: 10px;
      font-size: 1.2rem;
      color: #0f0;
      border: 1px solid #0f0;
      cursor: pointer;
      transition: background 0.3s;
    }

    li:hover, li:active {
      background: #1db954;
      color: #000;
    }

    #timer {
      font-size: 3rem;
      margin-top: 1.5rem;
      background: #010;
      display: inline-block;
      padding: 1rem 2rem;
      border: 4px solid #0f0;
      border-radius: 12px;
      box-shadow: 0 0 20px #0f0;
    }
  </style>
</head>
<body>

  <header>🎧 Playlist com Tempo LED</header>

  <div class="player">
    <audio id="audioPlayer" controls>
      <source id="audioSource" src="" type="audio/mpeg">
      Seu navegador não suporta áudio HTML5.
    </audio>

    <div id="timer">00:00</div>

    <ul id="playlist">
      <li data-src="musicas/musica1.mp3">🎵 Música 1 - Artista A</li>
      <li data-src="musicas/musica2.mp3">🎵 Música 2 - Artista B</li>
      <li data-src="musicas/musica3.mp3">🎵 Música 3 - Artista C</li>
    </ul>
  </div>

  <script>
    const playlist = document.querySelectorAll('#playlist li');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioSource = document.getElementById('audioSource');
    const timerDisplay = document.getElementById('timer');

    let intervalId;

    function formatTime(seconds) {
      const min = String(Math.floor(seconds / 60)).padStart(2, '0');
      const sec = String(Math.floor(seconds % 60)).padStart(2, '0');
      return `${min}:${sec}`;
    }

    function updateTimer() {
      const remaining = audioPlayer.duration - audioPlayer.currentTime;
      if (remaining >= 0) {
        timerDisplay.textContent = formatTime(remaining);
      }
    }

    function startTimer() {
      clearInterval(intervalId);
      intervalId = setInterval(updateTimer, 1000);
    }

    playlist.forEach(item => {
      item.addEventListener('click', () => {
        audioSource.src = item.getAttribute('data-src');
        audioPlayer.load();
        audioPlayer.play();
      });
    });

    audioPlayer.addEventListener('play', startTimer);
    audioPlayer.addEventListener('pause', () => clearInterval(intervalId));
    audioPlayer.addEventListener('ended', () => {
      clearInterval(intervalId);
      timerDisplay.textContent = "00:00";
    });
  </script>

</body>
</html>

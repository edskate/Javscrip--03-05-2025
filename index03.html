<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contador Interativo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      text-align: center;
      padding-top: 60px;
    }

    .container {
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      width: 300px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 20px;
    }

    #contador {
      font-size: 48px;
      margin: 20px 0;
    }

    button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #ffca28;
    }

    button:hover {
      background-color: #ffb300;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contador</h1>
    <div id="contador">0</div>
    <button onclick="alterarContador(-1)">-</button>
    <button onclick="alterarContador(1)">+</button>
  </div>

  <script>
    let valor = 0;

    function alterarContador(delta) {
      valor += delta;
      document.getElementById("contador").textContent = valor;
    }
  </script>
</body>
</html>
